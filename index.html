<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaRoute PSAU</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

html,body{
width:100%;
min-height:100%;
overflow:hidden;
}

/* BODY */
body{
display:flex;
height:100vh;
background:#f5f5f5;
}

/* SIDEBAR */
.sidebar{
width:260px;
background:#84B179;
color:white;
padding:15px;
overflow-y:auto;
flex-shrink:0;
transition:.3s ease;
z-index:4000;
}

.sidebar input{
width:100%;
padding:10px;
margin-bottom:10px;
border:none;
border-radius:6px;
}

.sidebar a{
display:block;
padding:10px;
background:#BBD8A3;
margin:5px 0;
color:black;
text-decoration:none;
border-radius:5px;
cursor:pointer;
word-break:break-word;
}

.back-btn{
width:100%;
padding:10px;
margin-bottom:10px;
border:none;
border-radius:6px;
background:white;
color:#84B179;
font-weight:bold;
cursor:pointer;
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
min-width:0;
height:100vh;
overflow:hidden;
}

/* HEADER */
.header{
background:#84B179;
color:white;
padding:12px 15px;
display:flex;
align-items:center;
gap:5px;
flex-shrink:0;
}

.menu-btn{
cursor:pointer;
display:none;
font-size:22px;
}

/* NAV */
.nav-box{
padding:8px 12px;
background:#BBD8A3;
display:flex;
flex-wrap:wrap;
gap:6px;
align-items:flex-end;
}

.nav-group{
display:flex;
flex-direction:column;
gap:3px;
flex:1;
min-width:120px;
}

.nav-box label{
font-size:12px;
font-weight:bold;
color:#2a4a1a;
}

.nav-box select{
width:100%;
height:36px;
padding:0 8px;
border:none;
border-radius:6px;
font-size:13px;
background:white;
}

.nav-box button{
padding:0 16px;
height:36px;
border:none;
border-radius:6px;
min-height:36px;
background:#84B179;
color:white;
cursor:pointer;
font-size:13px;
flex-shrink:0;
}

#directions{
width:100%;
font-size:12px;
margin-top:2px;
}

/* MAP */
.map-container{
flex:1;
position:relative;
overflow:auto;
background:#ccc;
padding:10px;
min-height:0;
-webkit-overflow-scrolling:touch;
}

.map{
position:relative;
width:1200px;
height:900px;
max-width:none;
background:url("images/puto_kanu_anang_seb.png") no-repeat center;
background-size:contain;
background-color:white;
margin:auto;
}

/* ROUTES */
#routeLayer{
position:absolute;
inset:0;
width:100%;
height:100%;
z-index:5;
pointer-events:none;
}

/* AREA POINTS */
.area{
position:absolute;
width:14px;
height:14px;
border-radius:50%;
background:#555;
transform:translate(-50%,-50%);
cursor:pointer;
z-index:20;
}

/* MODAL */
.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.6);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:5000;
}

.modal-content{
  background:white;
  width:600px;
  max-width:90%;
  border-radius:12px;
  overflow:hidden;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  background:#2d5c02;
  color:white;
}

.close-btn{
  background:rgba(0,0,0,0.6);
  color:white;
  border:none;
  border-radius:50%;
  width:30px;
  height:30px;
  cursor:pointer;
}

.modal-img{
  width:100%;
  height:300px;
  object-fit:cover;
}

.modal-body{
  padding:10px;
}

/* TOOLTIP */
.tooltip{
position:absolute;
background:#222;
color:white;
padding:6px 10px;
font-size:12px;
border-radius:6px;
white-space:nowrap;
transform:translate(-50%,-120%);
opacity:0;
pointer-events:none;
transition:.2s;
z-index:999;
}

/* MOBILE */
@media (max-width:768px){

body{
overflow:hidden;
}

/* Sidebar drawer */
.sidebar{
position:fixed;
left:-260px;
top:0;
height:100%;
box-shadow:2px 0 10px rgba(0,0,0,.2);
}

.sidebar.active{
left:0;
}

.menu-btn{
display:block;
}

/* Main layout */
.main{
display:flex;
flex-direction:column;
height:100dvh;
overflow:hidden;
}

/* FIXED MOBILE NAV */
.nav-box{
display:flex;
flex-direction:row;
flex-wrap:wrap;
gap:6px;
padding:8px 10px;
background:#BBD8A3;
flex-shrink:0;
align-items:flex-end;
}

.nav-group{
flex:1;
min-width:100px;
}

.nav-box label{
font-size:12px;
}

/* THIS FIXES THE GIANT BOXES */
.nav-box select{
width:100%;
height:36px;
padding:0 8px;
font-size:14px;
border:none;
border-radius:6px;
background:white;
appearance:auto;
-webkit-appearance:menulist;
}

/* Button */
.nav-box button{
height:36px;
border:none;
border-radius:6px;
background:#84B179;
color:white;
font-size:14px;
padding:0 14px;
flex-shrink:0;
}

/* MAP TAKES REMAINING SPACE */
.map-container{
flex:1;
overflow:auto;
padding:5px;
-webkit-overflow-scrolling:touch;
}

/* Keep large interactive map */
.map{
width:1200px;
height:900px;
min-width:1200px;
min-height:900px;
}

.modal-content{
width:100%;
}
}

.main{
width:100%;
height:100dvh;
min-height:0;
overflow:hidden;
}

.map-container{
flex:1;
min-height:0;
}


/* SMALLER PHONES */
@media (max-width:480px){

.header h3{
font-size:16px;
}

.nav-box{
padding:10px;
gap:8px;
}

.sidebar{
width:240px;
left:-240px;
}



.sidebar.active{
left:0;
}
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.4);
display:none;
z-index:3000;
}

.overlay.active{
display:block;
}



.map-container{
flex:1;
overflow:auto;
width:100%;
height:100%;
padding:10px;
-webkit-overflow-scrolling:touch;
}

.map{
width:1200px;
height:900px;
min-width:1200px;
min-height:900px;
}


</style>
</head>

const map=document.getElementById("map");
const list=document.getElementById("list");
const fromSelect=document.getElementById("from");
const toSelect=document.getElementById("to");
const routeLayer=document.getElementById("routeLayer");
const sidebar=document.getElementById("sidebar");


places.forEach(p=>{


let marker=document.createElement("div");
marker.className="area";
marker.style.left=p.x+"%";
marker.style.top=p.y+"%";


let tooltip=document.createElement("div");
tooltip.className="tooltip";
tooltip.innerText=p.name;

tooltip.style.left=p.x+"%";
tooltip.style.top=p.y+"%";


marker.addEventListener("mouseenter",()=>{
tooltip.style.opacity=1;
});

marker.addEventListener("mouseleave",()=>{
tooltip.style.opacity=0;
});


marker.onclick=()=>openModal(p);


map.appendChild(marker);
map.appendChild(tooltip);


let item=document.createElement("a");
item.innerText=p.name;
item.onclick=()=>openModal(p);
list.appendChild(item);


fromSelect.add(new Option(p.name,p.name));
toSelect.add(new Option(p.name,p.name));

});


function openModal(p){
title.innerText=p.name;
desc.innerText="Campus location";
const img=document.getElementById("modalImg");
img.src=p.img;
modal.style.display="flex";
}
function closeModal(){modal.style.display="none";}


function navigate(){

const from=fromSelect.value;
const to=toSelect.value;

drawRoute(from,to);

directions.innerHTML=`Route: ${from} → ${to}`;
}



function drawRoute(from,to){

routeLayer.innerHTML="";

let key=from+"|"+to;
let reverse=to+"|"+from;
let path=routes[key];

if(!path && routes[reverse]){
path=[...routes[reverse]].reverse();
}

if(!path){
let p1=places.find(p=>p.name===from);
let p2=places.find(p=>p.name===to);
path=[p1,p2];
}

let w=map.clientWidth;
let h=map.clientHeight;

let points=path.map(p=>`${(p.x/100)*w},${(p.y/100)*h}`).join(" ");

let poly=document.createElementNS("http://www.w3.org/2000/svg","polyline");
poly.setAttribute("points",points);
poly.setAttribute("fill","none");
poly.setAttribute("stroke","red");
poly.setAttribute("stroke-width","8");

routeLayer.appendChild(poly);
}


search.addEventListener("keyup",function(){
let val=this.value.toLowerCase();
let items=list.getElementsByTagName("a");

for(let i=0;i<items.length;i++){
items[i].style.display =
items[i].innerText.toLowerCase().includes(val) ? "block":"none";
}
});


function toggleMenu(){
sidebar.classList.toggle("active");
}

function goBack(){
modal.style.display="none";
sidebar.classList.remove("active");
}

function toggleMenu(){
document.getElementById("sidebar").classList.toggle("active");
}

function goBack(){
document.getElementById("sidebar").classList.remove("active");
}

window.addEventListener("resize",()=>{
if(window.innerWidth > 768){
document.getElementById("sidebar").classList.remove("active");
}
});
